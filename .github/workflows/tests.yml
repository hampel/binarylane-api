name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # The corners of the supported range, not the whole matrix: the floor with the
      # oldest dependencies it claims, the floor with current ones, and the ceiling.
      # Everything between fails only when a corner does.
      matrix:
        include:
          - { php: '8.3', deps: '--prefer-lowest' }
          - { php: '8.3', deps: '' }
          - { php: '8.5', deps: '' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer update --prefer-dist --no-progress ${{ matrix.deps }}

      - run: vendor/bin/phpunit

      # Also here, not only in a job of its own: phpstan.neon covers the whole 8.3 - 8.5
      # PHP range in one pass wherever it runs, but its result still depends on the
      # dependency tree it resolved against - including phpstan's own version, which is
      # what the --prefer-lowest corner is for.
      - run: vendor/bin/phpstan analyse --no-progress

  dependencies:
    name: Declared dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          # Both tools are dev dependencies that the install below deletes, so both have to
          # come from outside the package. Taking them from setup-php rather than installing
          # them into a scratch directory is not only tidier: it puts the binaries outside
          # every vendor tree, which for PHPStan is load-bearing. Run through a
          # vendor/bin/phpstan proxy, PHPStan picks up the autoloader sitting beside it, and
          # every package THAT tree has installed then resolves in the code being analysed -
          # so the check passes on exactly the class it exists to catch.
          tools: phpstan, composer-require-checker

      # One install serves both checks. --no-dev is what the second one needs; the first is
      # indifferent to it, because composer-require-checker builds its known-symbol set from
      # what "require" NAMES rather than from what is installed. That is worth stating
      # because the opposite is easy to assume: a symbol supplied by a dev dependency is
      # reported with that dependency sitting right there in vendor/.
      - run: composer install --no-dev --prefer-dist --no-progress

      # Analyse src/ with the dev dependencies gone, so anything it calls that is not in
      # "require" comes back as not-found. A normal PHPStan run has guzzle and phpunit
      # installed and sees nothing wrong, and the package would fatal for the consumer
      # instead. It matters here more than most - the whole point of this package is that it
      # needs four PSR interfaces and nothing else.
      #
      # -c is not optional. Without it PHPStan discovers the package's own phpstan.neon,
      # which points at tests/ and can no longer resolve PHPUnit - turning the run into a
      # configuration error while you are trying to read it as a dependency result.
      - run: >
          phpstan analyse
          -c .github/phpstan-nodev.neon
          --autoload-file=vendor/autoload.php --no-progress

      # The other half, and it catches what the run above cannot. PHPStan sees only what
      # src/ REACHES, so it is blind to a TRANSITIVE dependency - one arriving through
      # something we did declare, which survives --no-dev and reports clean. It is also blind
      # to a missing ext-*, because a function from an absent extension looks exactly like
      # one from core. ext-filter was undeclared until this check named it, with the run
      # above green.
      - run: composer-require-checker check composer.json

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer validate --strict

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/pint --test
